<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATMcp — Workbench</title>
  <style>
    :root {
      --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3340;
      --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
      --green:#3fb950; --amber:#d29922; --grey:#6e7681; --red:#f85149; --purple:#bc8cff;
    }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:12px; padding:9px 14px; flex:none;
      background:var(--panel); border-bottom:1px solid var(--border); }
    header h1 { font-size:15px; margin:0; font-weight:600; }
    header .team { color:var(--accent); }
    .pill { font-size:12px; padding:2px 9px; border-radius:999px; background:var(--panel2); color:var(--muted); border:1px solid var(--border); }
    #conn.live { color:var(--green); border-color:var(--green); }
    #conn.down { color:var(--red); border-color:var(--red); }
    .iconbtn { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px;
      padding:5px 10px; cursor:pointer; font:inherit; }

    .body { flex:1; min-height:0; display:flex; }
    /* LEFT tree */
    .sidebar { width:300px; flex:none; background:var(--panel); border-right:1px solid var(--border);
      display:flex; flex-direction:column; min-height:0; transition:width .15s, margin .15s; }
    .sidebar.collapsed { width:0; margin-left:0; overflow:hidden; border:none; }
    .sidebar h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; padding:12px 14px 6px; }
    .tree { flex:1; min-height:0; overflow-y:auto; padding:0 6px 12px; }
    .agentnode { margin:2px 0; }
    .agentrow { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer; }
    .agentrow:hover { background:var(--panel2); }
    .caret { color:var(--muted); width:10px; display:inline-block; transition:transform .1s; }
    .agentnode.open .caret { transform:rotate(90deg); }
    .dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .dot.healthy { background:var(--green); box-shadow:0 0 6px var(--green); }
    .dot.degraded { background:var(--amber); } .dot.offline { background:var(--grey); }
    .agentrow .nm { flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .agentrow .badge { font-size:10px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:0 6px; }
    .agentrow .plus { color:var(--accent); font-weight:700; padding:0 4px; border-radius:4px; }
    .agentrow .plus:hover { background:var(--border); }
    .sessions { margin:1px 0 4px 22px; display:none; }
    .agentnode.open .sessions { display:block; }
    .sess { display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--text); }
    .sess:hover { background:var(--panel2); }
    .sess.sel { background:var(--panel2); outline:1px solid var(--accent); }
    .sess .stitle { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sess .sstat { font-size:10px; color:var(--muted); }
    .sess .sstat.running { color:var(--amber); }
    .sess .sstat.running::before { content:"● "; animation:pulse 1.1s ease-in-out infinite; }
    .sess .sstat.done { color:var(--green); }
    .sess .sstat.failed { color:var(--red); }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.25;} }
    .sstatpill.working { color:var(--amber); border-color:var(--amber); }
    .sstatpill.done { color:var(--green); border-color:var(--green); }
    .sstatpill.failed { color:var(--red); border-color:var(--red); }
    .empty { color:var(--muted); font-style:italic; padding:6px 10px; font-size:12.5px; }

    /* RIGHT chat */
    .chat { flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
    .chathead { flex:none; display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--border); background:var(--panel); }
    .chathead .crumb { font-weight:600; }
    .chathead .crumb .mut { color:var(--muted); font-weight:400; }
    .transcript { flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:760px; padding:9px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
    .msg.you { align-self:flex-end; background:#1f6feb33; border:1px solid #1f6feb55; }
    .msg.agent { align-self:flex-start; background:var(--panel); border:1px solid var(--border);
      font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .msg.evt { align-self:center; color:var(--purple); font-size:12px; background:none; }
    .msg .role { font-size:10.5px; color:var(--muted); margin-bottom:3px; }
    .composer { flex:none; border-top:1px solid var(--border); padding:10px 14px; background:var(--panel); }
    .composer .row { display:flex; gap:8px; align-items:flex-end; }
    .composer textarea { flex:1; resize:none; min-height:42px; max-height:160px; background:var(--panel2);
      border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font:inherit; }
    .composer button { background:var(--accent); color:#04101f; border:none; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
    .composer button:disabled { opacity:.5; cursor:default; }
    .tokrow { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .tokrow input { flex:1; min-width:0; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; }
    .tokrow .muted { font-size:12px; color:var(--muted); }
    .placeholder { margin:auto; color:var(--muted); text-align:center; }
    .setup { padding:40px; max-width:640px; margin:0 auto; }
    .setup input { background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; width:240px; }
    .setup button { background:var(--accent); color:#04101f; border:none; padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; }

    @media (max-width:760px) {
      .sidebar { position:absolute; z-index:5; height:100%; box-shadow:0 0 30px #000a; }
      .sidebar.collapsed { width:0; }
      .msg { max-width:100%; }
    }
  </style>
</head>
<body>
  <div id="setup" class="setup" style="display:none">
    <h1>ATMcp Workbench</h1>
    <p class="muted">Enter a team name to command its agents.</p>
    <p><input id="teamInput" placeholder="team name" /> <button onclick="goTeam()">Open</button></p>
  </div>

  <div id="app" style="display:none; flex:1; min-height:0; flex-direction:column;">
    <header>
      <button class="iconbtn" onclick="toggleSidebar()" title="toggle sidebar">☰</button>
      <h1>ATMcp · <span class="team" id="teamName"></span></h1>
      <span class="pill" id="conn">connecting…</span>
      <span style="flex:1"></span>
      <a class="pill" id="dashLink" href="#" style="text-decoration:none">Dashboard ↗</a>
    </header>
    <div class="body">
      <aside class="sidebar" id="sidebar">
        <h2>Agents &amp; sessions</h2>
        <div class="tree" id="tree"></div>
      </aside>
      <main class="chat">
        <div class="chathead">
          <div class="crumb" id="crumb"><span class="mut">select or start a session →</span></div>
          <span class="pill sstatpill" id="sessStatus" style="display:none"></span>
          <span style="flex:1"></span>
          <button class="iconbtn" id="renameBtn" style="display:none" onclick="renameCurrent()">rename</button>
          <button class="iconbtn" id="archiveBtn" style="display:none" onclick="archiveCurrent()">archive</button>
        </div>
        <div class="transcript" id="transcript">
          <div class="placeholder" id="placeholder">Pick an agent on the left and start a session.</div>
        </div>
        <div class="composer">
          <div class="row">
            <textarea id="input" placeholder="Message the agent in this session…  (Enter = newline · click Send to send)" disabled></textarea>
            <button id="sendBtn" onclick="send()" disabled>Send</button>
          </div>
          <div class="tokrow">
            <input id="tokenInput" type="password" placeholder="join token (required to send / create sessions)" />
            <button class="iconbtn" onclick="saveToken()">save</button>
            <span class="muted" id="tokenState"></span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/workbench.js"></script>
</body>
</html>
